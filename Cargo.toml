[workspace]
members = [
    ".",
    "src-tauri",
]
resolver = "2"

[package]
name = "seo-lens"
version = "0.1.0"
edition = "2021"
authors = ["KR Shanto"]
description = "High-performance, local-first website crawler and technical SEO audit engine in Rust"
license = "MIT OR Apache-2.0"

[lib]
name = "seo_lens"
path = "src/lib.rs"

[[bin]]
name = "seolens"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "color"] }
compact_str = { version = "0.8", features = ["serde"] }
bitflags = { version = "2.8", features = ["serde"] }
url = "2.5"
ahash = "0.8"
lol_html = "3.0"
reqwest = { version = "0.12", features = ["gzip", "brotli", "deflate"] }
hashbrown = "0.15"
quick-xml = "0.37"
flate2 = "1.0"
petgraph = "0.8"
regex = "1.11"
rusqlite = { version = "0.33", features = ["bundled"] }
dirs = "6.0"


[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
